name: Private workspace checks
on:
  push:
    branches: [main]
    paths: ['apps/workspace/**', 'content/**', '.github/workflows/workspace.yml']
  pull_request:
    paths: ['apps/workspace/**', 'content/**', '.github/workflows/workspace.yml']
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/workspace
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/workspace/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Verify types, amounts, exports and encrypted backups
        run: |
          npm run check
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Configure an isolated UI test entry
        run: |
          python - <<'PY'
          import json,secrets
          from pathlib import Path
          c=json.loads(Path('../../content/workspace-source.json').read_text())
          Path('.env.local').write_text('\n'.join([
            'SUPABASE_URL='+c['url'],
            'SUPABASE_PUBLISHABLE_KEY='+c['publishable_key'],
            'WORKSPACE_ORIGIN=http://127.0.0.1:3100',
            'WORKSPACE_ENTRY='+secrets.token_hex(24)
          ])+'\n')
          PY
      - name: Build the separate Next.js application
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Install browser checks
        run: |
          python -m pip install -r ../../tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Start workspace and exercise private UI fixtures
        run: |
          npm start -- --port 3100 > /tmp/lutera-workspace.log 2>&1 &
          for attempt in {1..40}; do
            if curl --silent --fail http://127.0.0.1:3100/robots.txt > /dev/null; then break; fi
            sleep 1
          done
          python tests/browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: workspace-fixture-review
          path: apps/workspace/test-results
          retention-days: 7
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: PostgreSQL access rules with Supabase Auth fixtures
        working-directory: apps/workspace
        run: bash tests/database.sh
