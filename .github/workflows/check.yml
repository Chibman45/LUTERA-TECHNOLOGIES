name: Site checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/build.py
      - run: python scripts/check.py
      - run: python scripts/check_seo.py
      - run: python scripts/submit_indexnow.py
      - run: node --check assets/consent.js
      - run: node --check assets/app.js
      - run: node --check assets/experience.js
      - run: node --check assets/motion.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public pages
        env:
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
        run: python scripts/build.py
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify procurement and responsive flows
        run: python tests/browser_experience.py
      - name: Verify brand, navigation and service coverage
        run: python tests/browser_brand.py
      - name: Verify first-visit cookie choices and privacy controls
        run: python tests/browser_consent.py
