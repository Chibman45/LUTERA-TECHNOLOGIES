name: Site checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/build.py
      - run: python scripts/check.py
      - run: node --check assets/app.js
      - run: node --check assets/experience.js
      - run: node --check assets/motion.js
      - run: node --check assets/scene.js
      - run: node --check assets/cinematic.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public pages
        run: python scripts/build.py
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify procurement and responsive flows
        run: python tests/browser_experience.py
      - name: Verify tablet 3D and touch interaction
        run: python tests/browser_tablet_3d.py
      - name: Verify cinematic navigation and motion preferences
        run: python tests/browser_cinematic.py
