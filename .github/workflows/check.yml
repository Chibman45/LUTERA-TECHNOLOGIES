name: Site checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --check assets/consent.js
      - run: node --check assets/app.js
      - run: node --check assets/experience.js
      - run: node --check assets/motion.js
      - name: Verify Vercel production and preview artifacts
        run: python tests/build_vercel.py
      - name: Verify editable public content and changing service catalogues
        run: python tests/test_public_content.py
      - name: Build production artifact and validate search notification payload
        env:
          SITE_ORIGIN: https://lutera-ci.example
        run: |
          python scripts/build_vercel.py
          python scripts/submit_indexnow.py
  browser:
    runs-on: ubuntu-latest
    env:
      LUTERA_TEST_DIR: _site
      LUTERA_TEST_BASE: /
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build Vercel public pages
        env:
          SITE_ORIGIN: https://lutera-ci.example
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
        run: python scripts/build_vercel.py
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify procurement and responsive flows
        run: python tests/browser_experience.py
      - name: Verify brand, navigation and service coverage
        run: python tests/browser_brand.py
      - name: Verify photographic hero and motion controls
        run: python tests/browser_hero.py
      - name: Verify first-visit cookie choices and privacy controls
        run: python tests/browser_consent.py
